name: Bug report
description: Report a reproducible problem with omp-tandem.
body:
  - type: markdown
    attributes:
      value: |
        For security issues, follow [SECURITY.md](https://github.com/Flyozzzz/omp-tandem-public/blob/main/SECURITY.md) instead of posting public details.
        Remove credentials, tokens, private prompts, project content, session data, and identifying paths before submitting.
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include omp-tandem, Python, uv, and OMP versions; operating system and architecture; and the MCP host/client name and version.
      placeholder: "omp-tandem: …; Python: …; uv: …; OMP: …; OS/architecture: …; host/client: …"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give minimal steps or commands using synthetic data. Include installation method and relevant sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only relevant errors or output. Do not attach runtime directories, authentication files, session databases, or private conversation transcripts.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Submission check
      options:
        - label: I removed credentials and private runtime data, and this report does not disclose a security vulnerability.
          required: true
