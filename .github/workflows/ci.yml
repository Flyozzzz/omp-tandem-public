name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install frozen development environment
        run: uv sync --frozen --group dev
      - name: Run isolated tests
        run: uv run --frozen pytest -q
      - name: Verify real pinned OMP with localhost model
        timeout-minutes: 10
        run: >-
          uv run --frozen python scripts/verify_omp.py
          --cache-dir "${{ runner.temp }}/omp-compatibility-cache"
          --report "${{ runner.temp }}/omp-compatibility-${{ matrix.os }}.json"
      - name: Check lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Build wheel
        run: uv build --wheel
      - name: Check distribution manifest
        run: uv run --frozen python scripts/package.py --check
